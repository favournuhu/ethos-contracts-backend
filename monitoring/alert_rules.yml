# Alerting rules for Ethos-Protocol.
#
# Metric names correspond to those emitted by backend/src/metrics.rs and
# backend/src/custom_metrics.rs. Each alert links to the matching section in
# docs/runbook-alerts.md so on-call has a concrete next action.

groups:
  - name: ethos-api-health
    rules:
      - alert: EthosApiDown
        expr: up{job="ethos-backend-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Ethos-Protocol API is unreachable"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for 1m. See docs/runbook-alerts.md#ethosapidown"
          runbook: "docs/runbook-alerts.md#ethosapidown"

      - alert: EthosHighErrorRate
        expr: |
          (rate(ethos_protocol_request_errors_total[5m])
            / clamp_min(rate(ethos_protocol_http_requests_total[5m]), 1))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ethos-Protocol API error rate above 5%"
          description: "Error rate has been above 5% for 5m on {{ $labels.instance }}. See docs/runbook-alerts.md#ethoshigherrorrate"
          runbook: "docs/runbook-alerts.md#ethoshigherrorrate"

      - alert: EthosHighApiLatencyP99
        expr: histogram_quantile(0.99, rate(ethos_protocol_http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ethos-Protocol API p99 latency above 2s"
          description: "p99 request latency has exceeded 2s for 5m. See docs/runbook-alerts.md#ethoshighapilatencyp99"
          runbook: "docs/runbook-alerts.md#ethoshighapilatencyp99"

  - name: ethos-contract-health
    rules:
      - alert: EthosContractPaused
        expr: ethos_protocol_contract_paused == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ttl_vault contract is paused"
          description: "The on-chain contract has been in a paused state for 1m. See docs/runbook-alerts.md#ethoscontractpaused"
          runbook: "docs/runbook-alerts.md#ethoscontractpaused"

      - alert: EthosContractUpgradeInProgress
        expr: increase(ethos_protocol_contract_upgrade_events_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "ttl_vault contract upgrade event observed"
          description: "An upgrade() call was observed on-chain in the last 10m. Confirm it was authorized. See docs/runbook-alerts.md#ethoscontractupgradeinprogress"
          runbook: "docs/runbook-alerts.md#ethoscontractupgradeinprogress"

      - alert: EthosCredentialLifecycleAnomalies
        expr: increase(ethos_protocol_credential_lifecycle_errors_total[15m]) > 10
        labels:
          severity: warning
        annotations:
          summary: "Elevated credential lifecycle transition errors"
          description: "More than 10 credential lifecycle transition errors in 15m. See docs/runbook-alerts.md#ethoscredentiallifecycleanomalies"
          runbook: "docs/runbook-alerts.md#ethoscredentiallifecycleanomalies"

  # ── Issue #590: Alert Rules for Critical Events ──────────────────────────────
  - name: ethos-critical-events
    rules:
      - alert: EthosVaultReleaseSurge
        expr: increase(ethos_protocol_releases_total[5m]) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Unusual surge in vault releases"
          description: "More than 10 vault releases observed in a 5-minute window on {{ $labels.instance }}. May indicate TTL misconfiguration or an attack. See docs/runbook-alerts.md#ethosvaultreleasesurge"
          runbook: "docs/runbook-alerts.md#ethosvaultreleasesurge"

      - alert: EthosCriticalErrorRateSpiked
        expr: |
          (rate(ethos_protocol_request_errors_total[5m])
            / clamp_min(rate(ethos_protocol_http_requests_total[5m]), 1))
          > 0.10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Ethos-Protocol API critical error rate (>10%)"
          description: "Error rate has been above 10% for 2m on {{ $labels.instance }}. Immediate investigation required. See docs/runbook-alerts.md#ethoscriticalerrorrate"
          runbook: "docs/runbook-alerts.md#ethoscriticalerrorrate"

  # ── Issue #591: Canary Deployment Alerts ─────────────────────────────────────
  - name: ethos-canary-deployment
    rules:
      - alert: EthosCanaryRollbackTriggered
        expr: increase(ethos_protocol_canary_rollbacks_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Canary deployment rolled back automatically"
          description: "A canary deployment for {{ $labels.service }} was rolled back due to metric thresholds being breached. See docs/runary-deployments.md and docs/runbook-alerts.md#ethoscanaryrollback"
          runbook: "docs/runbook-alerts.md#ethoscanaryrollback"

      - alert: EthosCanaryHighErrorRate
        expr: ethos_protocol_canary_error_rate > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Canary deployment error rate elevated"
          description: "Canary deployment {{ $labels.deployment_id }} for {{ $labels.service }} has error rate above 5% for 3m. Automatic rollback may be imminent."
          runbook: "docs/runbook-alerts.md#ethoscanaryerrorrate"

  # ── Issue #592: Blue-Green Deployment Alerts ──────────────────────────────────
  - name: ethos-blue-green-deployment
    rules:
      - alert: EthosBlueGreenSlotUnhealthy
        expr: ethos_protocol_bluegreen_slot_health{health="unhealthy"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Blue-green deployment slot is unhealthy"
          description: "The {{ $labels.slot }} slot for deployment {{ $labels.deployment_id }} has been unhealthy for 2m. Rollback may be needed. See docs/runbook-alerts.md#ethosbluegreenslothealth"
          runbook: "docs/runbook-alerts.md#ethosbluegreenslothealth"

      - alert: EthosBlueGreenRollbackTriggered
        expr: increase(ethos_protocol_bluegreen_rollbacks_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Blue-green deployment was rolled back"
          description: "A blue-green deployment rollback was triggered for {{ $labels.service }}. Investigate the inactive slot before re-attempting. See docs/runbook-alerts.md#ethosbluegreen"
          runbook: "docs/runbook-alerts.md#ethosbluegreen"

  # ── Issue #593: Automated Rollback Alerts ─────────────────────────────────────
  - name: ethos-automated-rollback
    rules:
      - alert: EthosDeploymentAutoRolledBack
        expr: increase(ethos_protocol_deployment_rollbacks_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Post-deployment tests failed — automated rollback executed"
          description: "A deployment of {{ $labels.service }} was automatically rolled back due to post-deployment test failure. Check rollback history at GET /deployments/rollback/history. See docs/runbook-alerts.md#ethosdeploymentautorollback"
          runbook: "docs/runbook-alerts.md#ethosdeploymentautorollback"

      - alert: EthosRepeatedRollbacks
        expr: increase(ethos_protocol_deployment_rollbacks_total[1h]) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Multiple automated rollbacks in the last hour"
          description: "More than 2 automated deployment rollbacks for {{ $labels.service }} in the last hour. This indicates a systemic issue with the current release. Block further deploys until resolved."
          runbook: "docs/runbook-alerts.md#ethosrepeatedrollbacks"
